name: CI-CD Test

on:
    push:
        branches-ignore: 
            - main
    
    pull_request:
        paths: 
            - 'main/**'
        
    workflow_dispatch:

jobs:
    ci-check:
        runs-on: ubuntu-latest

        container:
            image: alpine:3.20

        defaults:
            run:
                working-directory: ./main

        steps:
            - name: Clone Repository Into Memory
              uses: actions/checkout@v4

            - name: Install Node.js and NPM inside Alpine
              run: apk add --no-cache nodejs npm
                        
            - name: Install Dependences
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build Test
              run: npm run build