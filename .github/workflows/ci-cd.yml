name: CI-CD Test

on:
    push:
        branches: 
            - main
        
    workflow_dispatch:

jobs:
    ci-check:
        runs-on: ubuntu-latest

        container:
            image: alpine:3.20

        defaults:
            run:
                working-directory: ./main

        steps:
            - name: Clone Repository Into Memory
              uses: actions/checkout@v4

            - name: Setup Node 22 with Built-in Cache
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: 'npm' 
                cache-dependency-path: ./main/package-lock.json
                
            - name: Install Dependences
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build Test
              run: npm run build